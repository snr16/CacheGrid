# Same system and workload as proxy-3node-slo, but with fewer connections and
# several requests in flight on each (pipelining). At 1 request per connection
# the client spends a system call per request and becomes the bottleneck
# (~83K ops/s flat from 100 to 400 concurrency); this shows what the cluster
# does when the client isn't the limit.
include ../bench.conf

bench.scenario.name = Pipelined clients: proxy + 3 nodes, 100 connections x depth
bench.load.max_connections = 100
bench.load.concurrency_levels = 100, 200, 300, 400, 600, 800
