# Full system under steady load while node2 is killed and restarted
# (benchmarks/run_benchmarks.sh does the killing). Prints a per-second timeline.
include ../bench.conf

bench.scenario.name = Failover: node2 killed and restarted under load
bench.load.concurrency_levels = 1000
bench.load.duration_ms = 30000
bench.load.timeline_interval_ms = 1000
