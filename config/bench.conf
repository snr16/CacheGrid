# Benchmark configuration
#
# Usage: ./build/release/shard_contention config/bench.conf
# The cache settings themselves (overhead, policy) come from the file named by
# bench.cache_config, so the benchmark measures the real node configuration.

bench.cache_config = config/cachegrid.conf

# ---- shard_contention: lock contention vs. shard count -----------------------

# Number of distinct keys, pre-loaded before timing starts.
bench.shard.keys = 10000

# Size of each value in bytes.
bench.shard.value_size = 64

# Operations each thread performs.
bench.shard.ops_per_thread = 1000000

# Percentage of operations that are SET (the rest are GET).
bench.shard.write_percent = 10

# Memory budget for the benchmark cache (large enough that nothing is evicted).
bench.shard.capacity = 256MB

# Shard counts to compare.
bench.shard.shard_counts = 1, 4, 16, 64

# Thread counts to compare. "auto" = number of hardware threads.
bench.shard.thread_counts = 1, auto

# ---- ring_analysis: consistent-hash balance and key movement -------------------

# Keys placed on the ring.
bench.ring.keys = 100000

# Cluster size measured (the add/remove test goes to nodes+1 and nodes-1).
bench.ring.nodes = 3

# Virtual-node counts to compare for load balance.
bench.ring.vnode_counts = 1, 10, 50, 100, 160, 500

# Virtual-node count used for the add/remove-node test (match proxy.conf).
bench.ring.change_vnodes = 160

# ---- cachegrid-bench: load tester (shared by all scenarios in config/bench/) ----
# Each scenario file includes this one and overrides what differs
# (target, workload, levels). bench.scenario.name is set by each scenario.

# Where requests go (the proxy by default).
bench.load.host = 127.0.0.1
bench.load.port = 7100

# Client event-loop threads. The client shares the laptop's 8 cores with the
# proxy and nodes, so keep it small.
bench.load.client_threads = 2

# Most connections the client opens. Higher concurrency is reached by keeping
# more requests in flight per connection (concurrency = connections x depth).
bench.load.max_connections = 500

# Requests in flight to measure at (the spec's four test levels).
bench.load.concurrency_levels = 100, 1000, 10000, 50000

# Per level: run unmeasured for warmup_ms, then measure for duration_ms.
bench.load.warmup_ms = 2000
bench.load.duration_ms = 10000

bench.load.connect_timeout_ms = 5000
# How often each client thread wakes to check for the end of a level.
bench.load.poll_tick_ms = 10
# Per-interval timeline (0 = off). The failover scenario turns it on.
bench.load.timeline_interval_ms = 0
bench.load.read_chunk_bytes = 64KB
bench.load.events_per_poll = 256
bench.load.max_reply_bytes = 2MB
# Latency histogram precision: 7 bits = every reported value within ~1.6%.
bench.load.histogram_precision_bits = 7
# File descriptors kept free besides client connections.
bench.load.fd_reserve = 64

# Preloading every key before measuring (so GETs can hit).
bench.load.preload_connections = 32
bench.load.preload_depth = 64

# Servers whose INFO is read for CPU, memory and eviction stats ("none" = skip).
bench.load.stats_nodes = 127.0.0.1:7001, 127.0.0.1:7002, 127.0.0.1:7003
bench.load.stats_proxy = 127.0.0.1:7100

# ---- Workload -------------------------------------------------------------------

# uniform | zipf | trace
bench.workload.type = uniform
bench.workload.keys = 100000
# Close to the real trace's average value (229 B).
bench.workload.value_size = 256
bench.workload.get_percent = 90
# Zipf skew in hundredths: 99 = 0.99, the YCSB standard ("very skewed").
bench.workload.zipf_theta_percent = 99
bench.workload.preload = true
bench.workload.seed = 42
# Cache-aside: after a GET miss, SET the key back (what a real application
# does after reading the value from its database).
bench.workload.refill_on_miss = true

# Trace replay: Twitter production cache trace, cluster52 (CC-BY 4.0,
# https://github.com/twitter/cache-trace). benchmarks/fetch_trace.sh streams
# the first trace_max_requests lines of this URL into trace_file.
bench.trace.source_url = https://ftp.pdl.cmu.edu/pub/datasets/twemcacheWorkload/open_source/cluster52.sort.zst
bench.workload.trace_file = data/traces/cluster52-5M.csv
bench.workload.trace_max_requests = 5000000
# Larger trace values are clamped to this (must fit server.max_request_bytes).
bench.workload.trace_max_value_bytes = 512KB

# ---- Failover scenario (used by benchmarks/run_benchmarks.sh) ------------------

# During config/bench/failover.conf: kill node2 this long after the measured
# window starts, and bring it back this long after that.
bench.failover.kill_after_s = 8
bench.failover.restart_after_s = 8
