# CacheGrid proxy configuration (local development)
#
# Format: one `key = value` per line; '#' starts a comment line.
# Every key is required. Send the proxy SIGHUP to reload `proxy.nodes`
# without restarting.

# ---- Cluster membership -----------------------------------------------------------

# Cache nodes as id@host:port, comma-separated. The id is what's hashed onto
# the ring, so a node keeps its keys if only its address changes.
proxy.nodes = node1@127.0.0.1:7001, node2@127.0.0.1:7002, node3@127.0.0.1:7003

# Points per node on the consistent-hash ring. More points = more even load
# across nodes (benchmarks/ring_analysis.cpp measures it), at a small memory/lookup cost.
proxy.vnodes_per_node = 160

# ---- Replication & recovery ------------------------------------------------------

# Unique id of this proxy (0-255). Goes into the low bits of every write's
# version number, so two proxies never produce the same version.
proxy.id = 0

# Copies of each key: its owner plus the next (n-1) nodes on the ring.
proxy.replication_factor = 2

# Copies that must confirm a SET/DEL before the client gets OK. 1 = stay
# available when one copy is down; equal to replication_factor = never
# acknowledge a write that isn't on every copy.
proxy.write_quorum = 1

# Health checks: PING every node this often...
proxy.health_interval_ms = 500
# ...a PING slower than this counts as failed...
proxy.health_timeout_ms = 1000
# ...and this many failures in a row marks the node Down.
proxy.health_fail_threshold = 3

# Before copying data to a recovering node, wait this long so writes that were
# already in flight land first. Must be >= proxy.request_timeout_ms.
proxy.recovery_grace_ms = 2000

# Commands sent per round trip while copying data during recovery.
proxy.resync_batch = 500

# Print node up/down/recovery events.
proxy.log_events = true

# ---- Talking to nodes ----------------------------------------------------------------

# Give up on a TCP connect to a node after this long.
proxy.connect_timeout_ms = 1000

# If a node has had a request outstanding this long, its connection is treated
# as failed and every waiting client gets an error.
proxy.request_timeout_ms = 2000

# After a node fails, answer its requests with an error immediately for this
# long instead of retrying the connection on every request.
proxy.reconnect_backoff_ms = 1000

# How often the proxy checks the timeouts above.
proxy.timer_tick_ms = 50

# Largest single reply accepted from a node. Must cover the largest value AND
# a whole cache shard returned by SCAN during recovery (node capacity / shards:
# 64MB / 64 = 1MB with the default node config, plus per-entry framing).
proxy.max_reply_bytes = 4MB

# ---- Client side (same meaning as the node's server.* settings) -------------------

proxy.bind_address = 127.0.0.1
# (Not 7000: macOS uses that port for AirPlay Receiver.)
proxy.port = 7100
proxy.worker_threads = 4
proxy.max_connections = 10000
proxy.listen_backlog = 1024
proxy.max_request_bytes = 1MB
proxy.max_args = 1024
proxy.max_output_buffer = 16MB
proxy.read_chunk_bytes = 16KB
proxy.events_per_poll = 256

# Commands one client may have in flight before the proxy stops reading more
# from it (back-pressure for clients that pipeline heavily).
proxy.max_pending_per_client = 1024

# File descriptors reserved for internal use. Must be >= 3 * worker_threads + 5
# + worker_threads * number of nodes (each worker keeps one connection per node).
proxy.fd_reserve = 64
