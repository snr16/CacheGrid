# Redis settings for the baseline benchmark (config/bench/redis-direct.conf).
# Chosen to match a CacheGrid node (config/cachegrid.conf) so the comparison
# is like-for-like: in-memory only, same memory budget, LRU eviction.

bind 127.0.0.1
port 6379

# Same budget and policy as cache.capacity / cache.eviction_policy.
maxmemory 64mb
maxmemory-policy allkeys-lru

# No persistence: CacheGrid keeps nothing on disk either.
save ""
appendonly no

# Same as server.listen_backlog / server.max_connections.
tcp-backlog 1024
maxclients 10000

# Redis's classic design: one thread does all the command work.
io-threads 1

daemonize no
loglevel notice
