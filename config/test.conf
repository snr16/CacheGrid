# Test-suite configuration.
#
# Tunable parameters for the unit/integration tests: sizes, counts, timeouts,
# thread counts, tolerances. Kept separate from the node/proxy configs so that
# retuning production can never break the tests.
# (Values that *define* a test scenario, like "advance the clock 99ms before a
# 100ms TTL", stay next to the assertion they belong to.)

# ---- Cache fixtures ---------------------------------------------------------------

# Per-entry overhead used by test caches.
test.entry_overhead_bytes = 96

# Capacity for single-shard tests that should never fill up.
test.big_capacity = 1MB

# Capacity for multi-threaded tests.
test.stress_capacity = 64MB

# Threads used by multi-threaded cache tests.
test.threads = 8

# Seed for randomized tests (fixed so any failure can be reproduced).
test.random_seed = 42

# Randomized comparison against the reference LRU model.
test.model.steps = 20000
test.model.key_space = 25
test.model.max_value_len = 40

# Concurrency stress sizes.
test.concurrency.writes_per_thread = 5000
test.concurrency.hot_key_ops = 20000
test.concurrency.hot_keys = 16
test.concurrency.eviction_ops = 10000
test.concurrency.gets_per_thread = 10000
test.concurrency.sweeper_ops = 5000
test.concurrency.spread_keys = 1000

# Command-handler test cache.
test.handler.capacity = 1MB
test.handler.shards = 4

# ---- Protocol parser limits (small so over-limit cases are cheap) -----------------

test.resp.max_request_bytes = 1KB
test.resp.max_args = 16

# ---- Hash ring ----------------------------------------------------------------------

test.ring.vnodes = 160
test.ring.keys = 30000
# A node's share varies by about 1/sqrt(vnodes) (~8% at 160 vnodes).
test.ring.balance_tolerance_percent = 15
test.ring.move_tolerance_percent = 15

# ---- In-process network servers -------------------------------------------------------

# Listener settings for test nodes and proxies (port 0 = OS picks a free port,
# so parallel test runs never collide).
test.listener.bind_address = 127.0.0.1
test.listener.port = 0
test.listener.worker_threads = 2
test.listener.max_connections = 64
test.listener.listen_backlog = 128
test.listener.max_request_bytes = 1MB
test.listener.max_args = 1024
test.listener.max_output_buffer = 16MB
test.listener.read_chunk_bytes = 16KB
test.listener.events_per_poll = 64
test.listener.fd_reserve = 64

test.server.cache_capacity = 64MB
test.server.cache_shards = 8
test.server.purge_interval_ms = 50

# A test client waits this long for a reply before failing (no hung tests).
test.client.recv_timeout_ms = 5000
# How often "eventually" conditions are re-checked.
test.client.poll_interval_ms = 5

test.server.concurrent_clients = 32
test.server.ops_per_client = 200
test.server.pipeline_depth = 500

# ---- Proxy ----------------------------------------------------------------------------

# Short timeouts keep the failure tests fast.
test.proxy.vnodes_per_node = 64
test.proxy.connect_timeout_ms = 500
test.proxy.request_timeout_ms = 500
test.proxy.reconnect_backoff_ms = 200
test.proxy.timer_tick_ms = 10
test.proxy.max_pending_per_client = 1024
test.proxy.max_reply_bytes = 4MB
test.proxy.nodes = 3
test.proxy.concurrent_clients = 16
test.proxy.ops_per_client = 200
test.proxy.pipeline_depth = 1000
test.proxy.small_pending_limit = 4
