# CacheGrid node configuration
#
# Format: one `key = value` per line; '#' starts a comment line.
# Every key is required. Missing or invalid values stop startup with an
# error naming the key.

# ---- Cache engine ------------------------------------------------------------

# Total memory budget for cached data. Units: B, KB, MB, GB (1024-based).
cache.capacity = 64MB

# Number of independently locked shards. More shards = less lock contention.
# 64 measured ~4x the single-lock throughput on 8 threads
# (reproduce: build/release/shard_contention config/bench.conf).
cache.num_shards = 64

# What to do when full:
#   lru        - evict least recently used entries (normal cache behaviour)
#   noeviction - reject writes with an out-of-memory error
cache.eviction_policy = lru

# Estimated bookkeeping memory per entry, on top of key + value bytes
# (list node, hash node, string headers, expiry time, duplicated key).
cache.entry_overhead_bytes = 96

# How long a replicated delete leaves a "tombstone" (a marker meaning "deleted
# at version V") so an older copy of the value can't be written back during
# recovery. Should comfortably exceed the time a node recovery takes.
cache.tombstone_ttl_ms = 60000

# ---- Network server ------------------------------------------------------------

# Interface to listen on. 127.0.0.1 = this machine only (safe for development).
# Use 0.0.0.0 to accept connections from other machines/containers.
server.bind_address = 127.0.0.1

# TCP port. 0 lets the OS pick a free port.
server.port = 7001

# Event-loop threads. Each serves many connections; around one per CPU core
# is a good start.
server.worker_threads = 4

# Clients beyond this get "-ERR max number of clients reached" and are closed.
server.max_connections = 10000

# Connections the kernel may queue before we accept() them (absorbs bursts).
server.listen_backlog = 1024

# Largest single command (key + value + framing). Bigger requests are
# rejected and the connection closed, so one client can't exhaust memory.
server.max_request_bytes = 1MB

# Most arguments allowed in one command (e.g. DEL k1 k2 ... kN).
server.max_args = 1024

# Per-client cap on replies waiting to be sent. A client that keeps sending
# without reading would otherwise grow this forever; past the cap it is
# disconnected.
server.max_output_buffer = 16MB

# Bytes read from a socket per recv() call.
server.read_chunk_bytes = 16KB

# Most ready sockets handled per event-loop wake-up.
server.events_per_poll = 256

# How often the background sweeper removes expired keys (milliseconds).
server.purge_interval_ms = 100

# File descriptors reserved for internal use (pollers, wake-up pipes, listener,
# stdio). Must be >= 3 * worker_threads + 5. The OS open-file limit must cover
# max_connections + fd_reserve; the server raises it at startup if allowed.
server.fd_reserve = 64
