# CacheGrid node configuration
#
# Format: one `key = value` per line; '#' starts a comment line.
# Every key is required. Missing or invalid values stop startup with an
# error naming the key.

# ---- Cache engine ------------------------------------------------------------

# Total memory budget for cached data. Units: B, KB, MB, GB (1024-based).
cache.capacity = 64MB

# Number of independently locked shards. More shards = less lock contention.
# 64 measured ~4x the single-lock throughput on 8 threads
# (see benchmarks/results.md).
cache.num_shards = 64

# What to do when full:
#   lru        - evict least recently used entries (normal cache behaviour)
#   noeviction - reject writes with an out-of-memory error
cache.eviction_policy = lru

# Estimated bookkeeping memory per entry, on top of key + value bytes
# (list node, hash node, string headers, expiry time, duplicated key).
cache.entry_overhead_bytes = 96
