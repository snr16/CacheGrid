# Proxy inside Docker (used by docker-compose.yml).
# Same as the local proxy config, but reachable from outside its container and
# pointing at the node containers by their Compose service names.
include ../proxy.conf

proxy.bind_address = 0.0.0.0
proxy.nodes = node1@node1:7001, node2@node2:7001, node3@node3:7001
